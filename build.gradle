// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Utility task used by the GitHub Actions rename step
task printVersionName {
    doLast {
        def v = "2.0"
        try {
            v = android.defaultConfig.versionName
        } catch (ignored) {}
        println v
    }
}
